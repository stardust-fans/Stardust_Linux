# StardustArch Live — BIOS/CSM SYSLINUX menu.
# mkarchiso substitutes %INSTALL_DIR%, %ARCH%, %ARCHISO_UUID% and
# %KERNEL_PARAMS%. Keep the file self-contained; no PXE entries are needed.
UI vesamenu.c32
MENU TITLE StardustArch Live
MENU WIDTH 78
MENU MARGIN 4
MENU ROWS 7
MENU VSHIFT 10
MENU TABMSGROW 14
MENU CMDLINEROW 14
MENU HELPMSGROW 16
MENU HELPMSGENDROW 29
MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #9033ccff #a0000000 std
MENU COLOR sel          7;37;40 #e0ffffff #20ffffff all
MENU COLOR unsel        37;44   #50ffffff #a0000000 std
MENU COLOR help         37;40   #c0ffffff #a0000000 std
MENU COLOR timeout_msg  37;40   #80ffffff #00000000 std
MENU COLOR timeout      1;37;40 #c0ffffff #00000000 std
MENU CLEAR

DEFAULT stardust
PROMPT 0
TIMEOUT 50
ONTIMEOUT stardust

LABEL stardust
    MENU LABEL StardustArch Live (BIOS)
    TEXT HELP
    Boot the StardustArch Live environment in BIOS/CSM mode.
    Derived from Arch Linux; not an official Arch Linux product.
    ENDTEXT
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

LABEL stardust-nomodeset
    MENU LABEL StardustArch Live (BIOS, nomodeset)
    TEXT HELP
    Troubleshooting entry for broken GPU early KMS. It disables kernel mode
    setting only for this boot; it does not change the installed system.
    ENDTEXT
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset %KERNEL_PARAMS%
