# Live ISO initramfs only. No PXE hooks are needed for a local ISO and
# removing them makes the initramfs smaller and faster to load.
# target-cleanup removes this drop-in from the installed system before
# Calamares regenerates the target initramfs.
HOOKS=(base udev microcode modconf memdisk archiso archiso_loop_mnt block filesystems keyboard fsck)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-3 -T0)
