# Target-system mkinitcpio configuration.
#
# The Live initramfs overrides HOOKS through
# /etc/mkinitcpio.conf.d/archiso.conf. On the installed system Calamares
# removes that drop-in and rewrites this file's hook list.
#
# encrypt + lvm2 are included so Calamares' LUKS/LVM partitioning paths
# produce a bootable initramfs. On systems without LUKS/LVM the hooks are
# cheap no-ops.
MODULES=()
BINARIES=()
FILES=()
HOOKS=(base udev autodetect microcode modconf kms keyboard keymap consolefont block encrypt lvm2 filesystems fsck)
