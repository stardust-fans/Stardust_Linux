---
# Start from the target's normal mkinitcpio.conf, but remove every ISO-only
# hook. The archiso hook cannot mount an installed root filesystem.
useSystemdHook: false
source: /etc/mkinitcpio.conf
hooks:
    prepend: []
    append: []
    remove:
        - memdisk
        - archiso
        - archiso_loop_mnt
        - archiso_pxe_common
        - archiso_pxe_nbd
        - archiso_pxe_http
        - archiso_pxe_nfs
