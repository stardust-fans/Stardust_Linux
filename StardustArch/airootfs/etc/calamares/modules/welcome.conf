---
# Welcome page. Storage and RAM are hard requirements; Internet is checked but
# NOT required, because the installation must remain possible offline even
# though the post-install pacman -Syu then has to be retried after first boot.
showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
showDonateUrl: ""

requirements:
    requiredStorage: 12.0
    requiredRam: 2.0
    internetCheckUrl: https://archlinux.org/
    check:
        - storage
        - ram
        - internet
        - root
        - screen
    required:
        - storage
        - ram
        - root

# GeoIP is intentionally disabled. Uncommenting a complete geoip block with
# style/url/selector would opt in to a geo lookup.
