---
# Optional repositories chosen at install time. The custom job module
# "stardustarch_options" reads packagechooser_repos from global storage and
# writes the target pacman configuration. No packages are installed by this
# page itself.
mode: optionalmultiple
method: legacy

labels:
    step: Repositories

items:
    - id: china-mirrors
      name: China mirrors
      description: >-
          Replace the target Arch Linux mirrorlist with HTTPS mirrors in
          mainland China. Recommended when installing from China. No packages
          are added.
      screenshot: /etc/calamares/branding/stardustarch/logo.png

    - id: archlinuxcn
      name: Arch Linux CN repository
      description: >-
          Add the community archlinuxcn repository and its keyring. It provides
          many China-oriented and AUR-adjacent packages. The keyring is
          installed and locally signed before the full system upgrade; if that
          fails, the repository is disabled and installation continues.
      screenshot: /etc/calamares/branding/stardustarch/logo.png
