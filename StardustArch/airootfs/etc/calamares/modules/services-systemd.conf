---
units:
    - name: NetworkManager.service
      action: enable
      mandatory: true
    - name: sddm.service
      action: enable
      mandatory: true
    - name: systemd-timesyncd.service
      action: enable
      mandatory: false
    - name: fstrim.timer
      action: enable
      mandatory: false
    - name: apparmor.service
      action: enable
      mandatory: false
    - name: bluetooth.service
      action: enable
      mandatory: false
    - name: power-profiles-daemon.service
      action: enable
      mandatory: false
    - name: NetworkManager-wait-online.service
      action: disable
      mandatory: false
    - name: pacman-init.service
      action: mask
      mandatory: false
