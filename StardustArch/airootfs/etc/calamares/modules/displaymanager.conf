---
# SDDM is the only display manager. The session file is the Plasma Wayland
# session installed by plasma-workspace.
displaymanagers:
    - sddm

defaultDesktopEnvironment:
    executable: /usr/bin/startplasma-wayland
    desktopFile: plasma

basicSetup: false
sysconfigSetup: false

sddm:
    configuration_file: /etc/sddm.conf
