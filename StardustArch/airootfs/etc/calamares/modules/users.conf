---
# One real user plus a separate root password. No target autologin and no
# empty password. "stardust" is reserved for the Live account, which is
# deleted from the target.
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - video
    - audio
    - input
    - network
    - storage
    - lp
    - optical
    - rfkill
    - power
    - uucp
    - name: wheel
      must_exist: false
      system: true

sudoersGroup: wheel
# Required by the Calamares schema. The empty string disables target
# autologin; displayAutologin/doAutologin below are also false.
autologinGroup: ""

setRootPassword: true
doReusePassword: false

displayAutologin: false
doAutologin: false

passwordRequirements:
    minLength: 8
    maxLength: 64
    libpwquality:
        - minlen=8
        - maxrepeat=3
        - maxsequence=3
        - usersubstr=4
        - badwords=stardustarch

allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
    shell: /bin/bash
    forbidden_names: [ root, stardust ]
    home_permissions: "o700"

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "stardustarch"
    forbidden_names: [ localhost, stardustarch-live ]

allowActiveDirectory: false

presets:
    fullName:
        editable: true
    loginName:
        editable: true
