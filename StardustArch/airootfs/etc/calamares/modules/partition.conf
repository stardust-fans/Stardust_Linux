---
# The ESP is mounted at /boot (not /boot/efi). This is required for
# systemd-boot's kernel-install integration and gives the UEFI target a single
# boot filesystem. BIOS installs still use GRUB; no ESP is needed there.
efi:
    mountPoint: /boot
    recommendedSize: 1024MiB
    minimumSize: 512MiB
    label: STARDUST

# zram is the default swap. A disk swapfile remains available for users who
# need hibernation; it is not selected by default.
userSwapChoices:
    - none
    - file
initialSwapChoice: none

drawNestedPartitions: true
alwaysShowPartitionLabels: true
initialPartitioningChoice: none
allowManualPartitioning: true
defaultFileSystemType: ext4
# Let Calamares choose GPT for UEFI and msdos for BIOS, which matches the
# BIOS GRUB path and avoids an unbootable BIOS/GPT layout.
#defaultPartitionTableType: gpt
luksGeneration: luks1
lvm:
    enable: true
