---
# Run from a copy in /run so deleting stardustarch-calamares-config from the
# target does not pull the script out from under bash.
dontChroot: true
timeout: 900
verbose: true
script:
    - "/usr/bin/install -m 0755 /usr/share/stardustarch/target-cleanup.sh /run/stardustarch-target-cleanup.sh"
    - command: "-/usr/bin/bash /run/stardustarch-target-cleanup.sh ${ROOT}"
      timeout: 900
      verbose: true
i18n:
    name: "Target cleanup"
