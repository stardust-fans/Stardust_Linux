---
# Used only for the BIOS/GRUB path. systemd-boot reads kernelParams from
# bootloader.conf instead. Do not add nowatchdog or mitigations=off.
overwrite: false
prefer_grub_d: false
keep_distributor: false
kernel_params: [ "quiet", "lsm=landlock,lockdown,yama,integrity,apparmor" ]
defaults:
    GRUB_TIMEOUT: 3
    GRUB_DEFAULT: saved
    GRUB_DISABLE_SUBMENU: true
    GRUB_TERMINAL_OUTPUT: console
    GRUB_DISABLE_RECOVERY: true
    GRUB_DISABLE_OS_PROBER: false
always_use_defaults: false
