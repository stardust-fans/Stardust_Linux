---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true

btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /var/cache
      subvolume: /@cache
    - mountPoint: /var/log
      subvolume: /@log

btrfsSwapSubvol: /@swap

# ext4/xfs: noatime avoids writes for atime; lazytime batches timestamp
# updates. btrfs adds transparent zstd compression.
mountOptions:
    - filesystem: default
      options: [ defaults, noatime, lazytime ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
    - filesystem: ext4
      options: [ defaults, noatime, lazytime ]
    - filesystem: xfs
      options: [ defaults, noatime, lazytime ]
    - filesystem: btrfs
      options: [ defaults, noatime, lazytime, compress=zstd:1 ]
    - filesystem: btrfs_swap
      options: [ defaults, noatime ]
