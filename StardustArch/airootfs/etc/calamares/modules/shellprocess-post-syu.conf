---
# The script itself manages its timeout and exit status. The leading "-" in
# the command tells shellprocess not to abort the installation when the
# post-install upgrade fails; the script still logs and records the status.
dontChroot: true
timeout: 3600
verbose: true
script:
    - command: "-/usr/bin/bash /usr/share/stardustarch/post-install-syu.sh ${ROOT}"
      timeout: 3600
      verbose: true
i18n:
    name: "Full system upgrade"
