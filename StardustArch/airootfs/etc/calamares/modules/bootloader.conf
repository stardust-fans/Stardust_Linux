---
# UEFI: systemd-boot on the ESP mounted at /boot.
# BIOS: Calamares automatically runs grub-install for firmwareType=bios.
# No hybrid GRUB double-install is needed.
efiBootLoader: systemd-boot
kernelSearchPath: /usr/lib/modules
kernelPattern: ^vmlinuz.*
loaderEntries:
    - "timeout 3"
    - "console-mode keep"
    - "editor no"
kernelParams: [ "quiet", "lsm=landlock,lockdown,yama,integrity,apparmor" ]
efiBootloaderId: StardustArch
installEFIFallback: true
installHybridGRUB: false
