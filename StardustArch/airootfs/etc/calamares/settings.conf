# StardustArch Calamares sequence.
#
# The exec order is deliberate:
#   unpackfs + mount        -> live rootfs is copied to the target
#   networkcfg              -> target resolv.conf/NetworkManager connection
#   stardustarch_options    -> optional China mirror / archlinuxcn repository
#   shellprocess@post-syu   -> pacman-key + pacman -Syu in arch-chroot
#   users                   -> create the target user AFTER the Live user is
#                              removed, so the first real user gets UID 1000
#   initcpiocfg/initcpio    -> rebuild the target initramfs after upgrades
#   bootloader              -> UEFI systemd-boot, BIOS GRUB
#   shellprocess@cleanup    -> remove Live-only packages and the Live user
#   umount                  -> last
#
# finishedq uses a branding QML override so the final page can carry the
# post-install warning required by the StardustArch specification.
---
modules-search: [ local ]

instances:
  - id: repos
    module: packagechooser
    config: packagechooser-repos.conf
  - id: post-syu
    module: shellprocess
    config: shellprocess-post-syu.conf
  - id: cleanup
    module: shellprocess
    config: shellprocess-cleanup.conf
  - id: stardust-finished
    module: finishedq
    config: finishedq.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - packagechooser@repos
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - locale
  - keyboard
  - localecfg
  - fstab
  - networkcfg
  - hwclock
  - services-systemd
  - stardustarch_options
  - shellprocess@post-syu
  - users
  - displaymanager
  - initcpiocfg
  - initcpio
  - grubcfg
  - bootloader
  - shellprocess@cleanup
  - umount
- show:
  - finishedq@stardust-finished

branding: stardustarch
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
