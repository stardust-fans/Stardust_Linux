#
# /etc/pacman.conf for the StardustArch build container only.
# This file is not copied into the Live ISO or the installed target.
#
# [customrepo] is first so the locally built calamares and
# stardustarch-calamares-config win over anything else. The repository is
# local and unsigned by a trusted packager key; SigLevel TrustAll is confined
# to the throwaway build environment.
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
ParallelDownloads = 20
#CheckSpace
VerbosePkgLists

# Keep the pacman cache on the persistent Docker volume. No NTFS/9P cache.
CacheDir = /var/cache/stardustarch/pacman/pkg/
LogFile  = /var/log/pacman.log

# Optional aria2c example (not enabled by default; ParallelDownloads is
# usually faster and does not require an external downloader):
#XferCommand = /usr/bin/aria2c --continue=true --max-connection-per-server=4 --split=4 --min-split-size=1M --dir=/var/cache/stardustarch/pacman/pkg --out=%o %u

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
#RemoteFileSigLevel = Required

#
# REPOSITORIES
#

[customrepo]
SigLevel = Optional TrustAll
Server = file:///tmp/stardustarch/customrepo

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Enable multilib only if you add 32-bit packages to EXTRA_PKGS.
#[multilib]
#Include = /etc/pacman.d/mirrorlist
