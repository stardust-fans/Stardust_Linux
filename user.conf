#!/usr/bin/env bash
# StardustArch build options.
#
# This file is sourced by scripts/container-build.sh inside the builder
# container. Keep values POSIX/bash friendly. Code and configuration stay in
# English; user-facing documentation is Chinese.
#
# SECURITY: the Live ISO uses a passwordless local account and a passwordless
# sudo rule so Calamares can be launched with one click. Both are removed by
# the Calamares post-install flow. Never reuse this profile for an installed
# system without that cleanup.

BRAND_NAME="StardustArch"
LIVE_USER="stardust"
TARGET_HOSTNAME_TEMPLATE="stardustarch"

# Include packages.desktop (browser/terminal/file manager/etc.).
# "no" still installs plasma-meta and the minimal KDE support set.
INSTALL_DESKTOP="yes"

# Include packages.speed (zram, zstd, apparmor, power-profiles-daemon).
INSTALL_SPEED_TWEAKS="yes"

# Use zram-generator as the default swap. "no" removes its configuration.
ENABLE_ZRAM="yes"

# Preinstall paru (paru-bin, built into [customrepo]). Requires network.
# This is separate from the installer page where the user chooses optional
# archlinuxcn and China-mirror repositories.
INSTALL_PARU="no"

# Build-time mirror selection inside the builder container.
# Leave MIRROR_COUNTRY empty to keep Arch's default mirrorlist.
# Examples: "CN", "DE", "US", or "".
USE_REFLECTOR="yes"
MIRROR_COUNTRY="CN"

# Parallel C/C++ compile jobs for Calamares. The default 6 is safe for a WSL2
# VM with about 8 GB RAM; raise it only if you have RAM to spare. An
# unconstrained -j$(nproc) on a 12-core/8 GB WSL can be OOM-killed.
BUILD_JOBS="6"

# Squashfs compression for the Live root filesystem.
# zstd boots noticeably faster than xz; the ISO grows.
SQUASHFS_COMPRESSION="zstd"
SQUASHFS_LEVEL="15"

# Early KMS modules baked into the initramfs. Generic ISOs should stay "none".
# Accepted:
#   none | intel | amdgpu | nvidia | nvidia-open
# "nvidia" and "nvidia-open" also add the matching driver packages and are
# only appropriate when the ISO is built for known NVIDIA hardware.
EARLY_KMS="none"

# Extra official-repository packages appended to the assembled package list.
EXTRA_PKGS=()

# The installer's "Repositories" page (Calamares packagechooser) always offers
# both choices; selecting none is valid. These values only document the URLs
# used by the post-install helper in the custom module.
ARCHLINUXCN_SERVER="https://repo.archlinuxcn.org/\$arch"
CHINA_MIRRORS=(
    "https://mirrors.tuna.tsinghua.edu.cn/archlinux/\$repo/os/\$arch"
    "https://mirrors.ustc.edu.cn/archlinux/\$repo/os/\$arch"
    "https://mirrors.aliyun.com/archlinux/\$repo/os/\$arch"
    "https://mirrors.bfsu.edu.cn/archlinux/\$repo/os/\$arch"
    "https://geo.mirror.pkgbuild.com/\$repo/os/\$arch"
)
